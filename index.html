<style>
/* reset propio */
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: columna única tipo app, cabecera con la onda del calçadão, navegación fija abajo. */
:root{
  --bg:#F3F6EE; --surface:#FFFFFF; --surface2:#E5EDDB; --ink:#0D2418; --muted:#566A5B; --line:#D2DCC8;
  --accent:#007A33; --accent-ink:#FFFFFF; --sun:#FFDF00; --sun-ink:#1B2A00; --blue:#002776;
  --good:#17803A; --bad:#B83A2E; --shadow:0 1px 2px rgba(13,36,24,.08),0 6px 18px rgba(13,36,24,.06);
  --f-display:"Londrina Solid","Trebuchet MS",system-ui,sans-serif;
  --f-body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#07150D; --surface:#0E2417; --surface2:#153222; --ink:#ECF5E6; --muted:#9DB5A2; --line:#24432F;
  --accent:#3FD16E; --accent-ink:#04200E; --sun:#FFDF00; --sun-ink:#1B2A00; --blue:#9DBBFF; --good:#4CD27F; --bad:#F28B7D;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#07150D; --surface:#0E2417; --surface2:#153222; --ink:#ECF5E6; --muted:#9DB5A2; --line:#24432F;
  --accent:#3FD16E; --accent-ink:#04200E; --sun:#FFDF00; --sun-ink:#1B2A00; --blue:#9DBBFF; --good:#4CD27F; --bad:#F28B7D;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 96px;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.wrap{max-width:720px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:900;margin:0;text-wrap:balance;letter-spacing:.015em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* cabecera */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-top:12px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{min-width:0;display:flex;align-items:center;gap:10px}
.brand .nm{min-width:0}
.logo{width:42px;height:42px;flex:none;display:block}
.brand h1{font-size:33px;font-weight:900;line-height:1;color:var(--blue)}
.brand .trip{font-size:13px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.sync{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;cursor:pointer}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.live i{background:var(--good)}
.wave{display:block;width:100%;height:20px;margin-top:8px}
.wave path{fill:none;stroke-width:3;stroke-linecap:round}
.wave .w1{stroke:var(--accent)}
.wave .w2{stroke:var(--sun)}

/* controles */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;min-height:40px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.sun{background:var(--sun);color:var(--sun-ink);border-color:transparent}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 10px;min-height:32px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.seg{display:flex;background:var(--surface2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:7px 8px;font-weight:600;color:var(--muted);min-height:34px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
label.f{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:42px}
textarea{min-height:90px;resize:vertical}

/* tarjetas */
main{padding-top:16px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.card h2{font-size:23px;margin-bottom:10px;color:var(--blue)}
.banner{background:var(--sun);color:var(--sun-ink);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner b{font-family:var(--f-display)}
.banner .btn{background:var(--sun-ink);color:var(--sun);border:0}
.empty{text-align:center;padding:18px 8px;color:var(--muted)}

/* gastos */
.total{font-family:var(--f-display);font-weight:900;font-size:40px;line-height:1.05;letter-spacing:.01em}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:12px}
.stat .v{font-weight:700;font-size:17px}
.bal{display:grid;grid-template-columns:minmax(64px,90px) 1fr auto;gap:10px;align-items:center;padding:6px 0}
.bal .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{position:relative;height:10px;background:var(--surface2);border-radius:6px}
.track::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;background:var(--line)}
.fill{position:absolute;top:0;bottom:0;border-radius:6px}
.fill.pos{left:50%;background:var(--good)}
.fill.neg{right:50%;background:var(--bad)}
.pos-t{color:var(--good)} .neg-t{color:var(--bad)}
.pay{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.pay:first-of-type{border-top:0}
.pay .arrow{color:var(--muted)}
.day-h{font-family:var(--f-display);font-weight:400;font-size:17px;letter-spacing:.03em;color:var(--muted);margin:14px 0 4px;text-transform:capitalize}
.exp{display:grid;grid-template-columns:1fr auto;gap:2px 12px;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);padding:11px 0}
.exp:first-of-type{border-top:0}
.exp .d{font-weight:600}
.exp .amt{text-align:right;font-weight:700}
.tag{display:inline-block;font-size:11px;font-weight:600;border-radius:6px;padding:1px 7px;background:var(--surface2);color:var(--muted);margin-right:6px}

/* plan */
.count{display:flex;align-items:baseline;gap:10px}
.count b{font-family:var(--f-display);font-size:46px;font-weight:900;line-height:1}
.day{border-left:3px solid var(--line);padding-left:14px;margin-left:4px}
.day.today{border-left-color:var(--sun)}
.day h3{font-size:16px;text-transform:capitalize;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.item{display:grid;grid-template-columns:52px 1fr;gap:10px;width:100%;text-align:left;background:transparent;border:0;padding:8px 0}
.item .t{font-weight:600;color:var(--muted);font-size:13px;padding-top:2px}
.item .ti{font-weight:600}
.item a{color:var(--accent);font-size:13px}

/* juego */
.rosco{display:block;width:100%;max-width:360px;margin:0 auto}
.rl{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.rl.c{fill:var(--good);stroke:var(--good)} .rl.w{fill:var(--bad);stroke:var(--bad)}
.rl.s{fill:var(--surface);stroke:var(--sun);stroke-width:3} .rl.cur{stroke:var(--accent);stroke-width:4}
.rt{font:400 17px var(--f-display);fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.rl.c+.rt,.rl.w+.rt{fill:#fff}
.clue{font-size:17px;font-weight:500;margin:6px 0 10px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;margin-top:8px;font-weight:500}
.opt.ok{background:var(--good);color:#fff;border-color:var(--good)}
.opt.no{background:var(--bad);color:#fff;border-color:var(--bad)}
.rank{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line)}
.rank:first-of-type{border-top:0}

/* frases */
.ph{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 0;border-top:1px solid var(--line)}
.ph:first-of-type{border-top:0}
.ph .pt{font-family:var(--f-display);font-weight:400;font-size:23px;letter-spacing:.01em}
.ph .es{color:var(--muted);font-size:13px}
.ph .pr{font-size:13px;color:var(--accent);font-weight:500}
.sos{display:flex;gap:10px;flex-wrap:wrap}
.sos div{flex:1;min-width:92px;background:var(--surface2);border-radius:10px;padding:10px;text-align:center}
.sos b{display:block;font-family:var(--f-display);font-size:28px;font-weight:900}

/* navegación */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
nav.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:10px;color:var(--muted);font-size:12px;font-weight:600}
nav.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--surface2);box-shadow:inset 0 -3px 0 var(--sun)}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:24;
  border-radius:999px;padding:12px 18px;box-shadow:0 6px 18px rgba(0,0,0,.25)}

/* dialog y aviso */
dialog{border:0;border-radius:16px;padding:0;background:var(--surface);color:var(--ink);width:min(560px,calc(100vw - 24px));max-height:88vh;box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(6,14,20,.55)}
.dlg{padding:18px 18px 16px}
.dlg h2{font-size:25px;margin-bottom:4px;color:var(--blue)}
.dlg .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--surface)}
.checks input{width:auto;min-height:0}
.mrow{display:flex;gap:8px;margin-top:8px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:60;max-width:calc(100vw - 32px);text-align:center}
@media (prefers-reduced-motion:no-preference){.card,.banner{animation:in .25s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}}}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <div class="top-row">
    <div class="brand"><svg class='logo' viewBox='0 0 100 100' aria-hidden='true'><rect width='100' height='100' rx='22' fill='#009C3B'/><path d='M50 15 L92 50 L50 85 L8 50Z' fill='#FFDF00'/><circle cx='50' cy='50' r='19' fill='#002776'/><circle cx='50' cy='40' r='2.8' fill='#fff'/><rect x='36' y='42.5' width='28' height='2' rx='1' fill='#fff'/><path d='M46.5 43 L53.5 43 L56.5 62 L43.5 62Z' fill='#fff'/></svg><div class="nm"><h1>Viajecinho</h1><div class="trip" id="tripLine"></div></div></div>
    <div class="top-actions"><button class="btn sm" id="btnSet" type="button">Ajustes</button><span class="sync" id="sync" data-act="syncnow" role="button" title="Tocá para actualizar"><i></i><span>Solo este celular</span></span></div>
  </div>
  <svg class="wave" viewBox="0 0 400 20" preserveAspectRatio="none" aria-hidden="true"><defs><pattern id="wv" width="40" height="20" patternUnits="userSpaceOnUse"><path class="w1" d="M0 5 Q10 -1 20 5 T40 5"/><path class="w2" d="M0 14 Q10 8 20 14 T40 14"/></pattern></defs><rect width="400" height="20" fill="url(#wv)" style="stroke:none"/></svg>
</header>
<main id="panel" aria-live="polite"></main>
</div>
<button class="btn primary fab" id="fab" type="button" hidden></button>
<nav class="tabs" aria-label="Secciones"><div class="in" id="tabs"></div></nav>

function put(coll, obj) {
  const i = S[coll].findIndex(x => x.id === obj.id);
  if (i >= 0) S[coll][i] = obj; else S[coll].push(obj);
  if (!db && SYNC.code) { PENDING.push(() => put(coll, obj)); render(); return; }
  saveLocal();
  if (db) db.collection(coll).doc(obj.id).set(obj).catch(errMsg);
  render();
}
function del(coll, id) {
  S[coll] = S[coll].filter(x => x.id !== id);
  if (!db && SYNC.code) { PENDING.push(() => del(coll, id)); render(); return; }
  saveLocal();
  if (db) db.collection(coll).doc(id).delete().catch(errMsg);
  render();
}

const UNSUB = [];
let retryT = null, retries = 0;
function attachDb(handle, keep) {
  db = handle; loading = true; syncState = "connecting"; if (!keep) S = blank(); paintSync();
  UNSUB.splice(0).forEach(f => { try { f(); } catch (e) {} });
  const ok = {}, sig = {};
  let timer = null, failed = false;
  const arm = () => { clearTimeout(timer); timer = setTimeout(() => { if (syncState !== "live") { loading = false; syncState = "slow"; paintSync(); } }, 10000); };
  arm();
  /* "en vivo" = Firestore confirmó que está al día con el servidor (fromCache = false). Se pide includeMetadataChanges
     porque, si no hubo cambios, Firestore no avisa esa confirmación y la app quedaba en "Sin conexión" aunque todo andaba. */
  const done = (name, snap) => {
    ok[name] = !snap.metadata.fromCache;
    if (failed) return;
    if (Object.values(ok).some(Boolean)) {
      loading = false; clearTimeout(timer); retries = 0; SYNC.err = "";
      if (syncState !== "live") { syncState = "live"; paintSync(); }
    } else if (syncState === "live") { syncState = "connecting"; paintSync(); arm(); }
  };
  const bad = e => {
    failed = true;
    SYNC.err = (e && e.code) || "error";
    syncState = "slow"; paintSync();
    if (retryT) return;
    retryT = setTimeout(() => { retryT = null; retries++; if (db === handle) attachDb(handle, true); }, Math.min(30000, 3000 * Math.pow(2, Math.min(retries, 4))));
  };
  const take = (name, data, snap) => {
    done(name, snap);
    const g = JSON.stringify(data);
    if (sig[name] === g) return;
    sig[name] = g;
    if (name === "meta") S.meta = data; else S[name] = data;
    remoteRender(name);
  };
  UNSUB.push(db.doc("meta/main").onSnapshot(s => take("meta", s.exists ? Object.assign(blankMeta(), s.data()) : blankMeta(), s), bad));
  ["expenses", "items", "scores", "questions"].forEach(c => UNSUB.push(db.collection(c).onSnapshot(s => take(c, s.docs.map(d => d.data()), s), bad)));
  PENDING.splice(0).forEach(f => f());
}
function remoteRender(c) {
  saveCache();
  if (tab === "juego" && (G.rosco || G.trivia)) return;
  if (tab === "frases") return;
  render();
}

}

/* ---------- gastos ---------- */
function calc() {
  const d = D(), ms = d.meta.members, ids = new Set(ms.map(m => m.id));
  const paid = {}, owe = {}; ms.forEach(m => { paid[m.id] = 0; owe[m.id] = 0; });
  let total = 0;
  d.expenses.forEach(e => {
    const v = expV(e); total += v;
    if (ids.has(e.payer)) paid[e.payer] += v;
    const sp = (e.split || []).filter(i => ids.has(i));
    sp.forEach(i => { owe[i] += v / sp.length; });
  });
  const net = ms.map(m => ({ m, paid: paid[m.id], owe: owe[m.id], net: paid[m.id] - owe[m.id] }));
  const cr = net.filter(x => x.net > 0.005).map(x => ({ m: x.m, v: x.net })).sort((a, b) => b.v - a.v);
  const de = net.filter(x => x.net < -0.005).map(x => ({ m: x.m, v: -x.net })).sort((a, b) => b.v - a.v);
  const pays = []; let i = 0, j = 0;
  while (i < de.length && j < cr.length) {
    const x = Math.min(de[i].v, cr[j].v);
    pays.push({ from: de[i].m, to: cr[j].m, v: x });
    de[i].v -= x; cr[j].v -= x;
    if (de[i].v < 0.005) i++; if (cr[j].v < 0.005) j++;
  }
  return { total, net, pays };
}

function vGastos() {
  const d = D(), base = d.meta.base, c = calc(), ms = d.meta.members;
  const max = Math.max(1, ...c.net.map(x => Math.abs(x.net)));
  const per = ms.length ? c.total / ms.length : 0;
  const rl = CURS.filter(x => x !== base).map(x => "1 " + SYM[x] + " = " + money(rate(x) / rate(base), base)).join(" · ");
  let h = '<section class="card"><div class="eyebrow">Total del grupo</div><div class="total num">' + money(c.total, base) + '</div>' +
    '<div class="stats"><div class="stat"><div class="eyebrow">Por persona</div><div class="v num">' + money(per, base) + '</div></div>' +
    '<div class="stat"><div class="eyebrow">Gastos cargados</div><div class="v num">' + d.expenses.length + '</div></div></div>' +
    '<p class="small muted" style="margin:12px 0 0">Cotización: ' + rl + (d.meta.ratesSet ? "" : " (de ejemplo)") + ' · <a href="#" data-act="settings" style="color:var(--accent)">cambiar</a></p></section>';
  h += '<section class="card"><h2>Saldos</h2>';
  if (!ms.length) h += '<div class="empty">Cargá a las personas del viaje en Ajustes.</div>';
  c.net.forEach(x => {
    const w = Math.min(50, Math.abs(x.net) / max * 50);
    const cls = x.net > 0.005 ? "pos" : x.net < -0.005 ? "neg" : "";
    h += '<div class="bal"><div class="name">' + esc(x.m.name) + '</div><div class="track">' + (cls ? '<div class="fill ' + cls + '" style="width:' + w + '%"></div>' : "") + '</div>' +
      '<div class="num ' + (cls === "pos" ? "pos-t" : cls === "neg" ? "neg-t" : "muted") + '" style="font-weight:700;text-align:right">' +
      (cls === "pos" ? "+" : cls === "neg" ? "−" : "") + money(Math.abs(x.net), base) + "</div></div>";
  });
  h += '<p class="small muted" style="margin:8px 0 0">Verde: le deben plata. Rojo: debe plata.</p></section>';
  h += '<section class="card"><h2>Para saldar</h2>';
  if (!c.pays.length) h += '<div class="empty">Están a mano. No se debe nada.</div>';
  c.pays.forEach(p => { h += '<div class="pay"><b>' + esc(p.from.name) + '</b><span class="arrow">le paga a</span><b>' + esc(p.to.name) + '</b><span class="num" style="margin-left:auto;font-weight:700">' + money(p.v, base) + "</span></div>"; });
  h += '<div class="row" style="margin-top:12px"><button class="btn" data-act="copysum" type="button">Copiar resumen para WhatsApp</button></div></section>';
  h += '<section class="card"><h2>Gastos</h2>';
  if (!d.expenses.length) h += '<div class="empty">Todavía no hay gastos. Tocá «Agregar gasto».</div>';
  const list = d.expenses.slice().sort((a, b) => (b.date || "").localeCompare(a.date || "") || b.id.localeCompare(a.id));
  let last = null;
  list.forEach(e => {
    if (e.date !== last) { h += '<div class="day-h">' + (e.date ? esc(fmtDate(e.date)) : "Sin fecha") + "</div>"; last = e.date; }
    const sp = (e.split || []).filter(i => ms.some(m => m.id === i));
    const who = sp.length === ms.length ? "entre todos" : "entre " + sp.map(i => esc(mname(i))).join(", ");
    h += '<button class="exp" data-act="editexp" data-id="' + esc(e.id) + '" type="button"><div><div class="d">' + esc(e.desc) + '</div>' +
      '<div class="small muted"><span class="tag">' + esc(e.cat || "Otros") + "</span>Pagó " + esc(mname(e.payer)) + " · " + who + '</div></div>' +
      '<div class="amt num">' + money(+e.amt || 0, e.cur) + (e.cur !== base ? '<div class="small muted" style="font-weight:500">' + money(expV(e), base) + (+e.ars > 0 && e.cur !== "ARS" ? " · $ " + (e.ars / e.amt).toFixed(1).replace(".", ",") + " por " + SYM[e.cur] : "") + "</div>" : "") + "</div></button>";
  });
  return h + "</section>";
}

function summaryText() {
  const d = D(), base = d.meta.base, c = calc();
  let t = "*Gastos del viaje" + (d.meta.dest ? " · " + d.meta.dest : "") + "*\nTotal: " + money(c.total, base) + "\n\n*Saldos*\n";

}

const mapsUrl = p => "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(p);

function vPlan() {
  const d = D(), m = d.meta, today = todayISO();
  const days = new Set(d.items.map(i => i.date).filter(Boolean));
  if (m.start && m.end) {
    const a = dateOf(m.start), b = dateOf(m.end);
    for (let t = new Date(a), n = 0; t <= b && n < 45; t.setDate(t.getDate() + 1), n++) {
      days.add(t.getFullYear() + "-" + String(t.getMonth() + 1).padStart(2, "0") + "-" + String(t.getDate()).padStart(2, "0"));
    }
  }
  const sorted = [...days].sort();
  let cnt = '<span class="muted">Cargá las fechas del viaje en Ajustes.</span>';
  if (m.start) {
    const toStart = Math.round((dateOf(m.start) - dateOf(today)) / 864e5);
    const toEnd = m.end ? Math.round((dateOf(m.end) - dateOf(today)) / 864e5) : toStart;
    if (toStart > 0) cnt = '<b class="num">' + toStart + "</b><span>" + (toStart === 1 ? "día para salir" : "días para salir") + "</span>";
    else if (toEnd >= 0) cnt = '<b class="num">' + (1 - toStart) + "</b><span>de " + (m.end ? Math.round((dateOf(m.end) - dateOf(m.start)) / 864e5) + 1 : "?") + " días de viaje</span>";
    else cnt = "<span class=\"muted\">El viaje ya terminó. ¡Que lo disfruten los recuerdos!</span>";
  }
  let h = '<section class="card"><div class="eyebrow">' + esc(m.dest || "Destino sin cargar") + '</div><div class="count" style="margin-top:6px">' + cnt + "</div></section>";
  sorted.forEach(dt => {
    const its = d.items.filter(i => i.date === dt).sort((a, b) => (a.time || "99").localeCompare(b.time || "99"));
    h += '<section class="card"><div class="day' + (dt === today ? " today" : "") + '"><div class="row between"><h3>' + esc(fmtDate(dt)) + (dt === today ? ' <span class="tag" style="background:var(--sun);color:var(--sun-ink)">Hoy</span>' : "") +

/* ---------- juego ---------- */
const G = { mode: "rosco", player: "", rosco: null, trivia: null };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function playerSel() {
  const ms = D().meta.members;
  if (!G.player || !ms.some(m => m.name === G.player)) G.player = ms[0] ? ms[0].name : "";
  return '<label class="f" for="gp" style="margin-top:0">Juega</label><select id="gp" data-chg="gplayer">' + ms.map(m => "<option" + (m.name === G.player ? " selected" : "") + ">" + esc(m.name) + "</option>").join("") + "</select>";
}
function saveScore(game, pts, total) {
  if (isEx()) return;
  put("scores", { id: uid(), game, player: G.player, pts, total, ts: Date.now() });
}
function vRanking() {
  const sc = D().scores; let h = '<section class="card"><h2>Ranking del grupo</h2>';
  if (!sc.length) return h + '<div class="empty">Todavía nadie jugó. El que gane paga la primera caipirinha.</div></section>';
  [["rosco", "Rosco"], ["trivia", "Trivia"]].forEach(([g, label]) => {
    const best = {};
    sc.filter(s => s.game === g).forEach(s => { if (!best[s.player] || s.pts > best[s.player].pts) best[s.player] = s; });
    const rows = Object.values(best).sort((a, b) => b.pts - a.pts).slice(0, 5);
    if (!rows.length) return;
    h += '<div class="eyebrow" style="margin:10px 0 2px">' + label + "</div>";
    rows.forEach((s, i) => { h += '<div class="rank"><span>' + (i + 1) + ". " + esc(s.player) + '</span><b class="num">' + s.pts + "/" + s.total + "</b></div>"; });
  });
  return h + "</section>";
}

function vJuego() {
  let h = '<div class="seg" role="group" aria-label="Juego"><button type="button" data-act="gmode" data-m="rosco" aria-pressed="' + (G.mode === "rosco") + '">Rosco</button><button type="button" data-act="gmode" data-m="trivia" aria-pressed="' + (G.mode === "trivia") + '">Trivia</button></div>';
  h += G.mode === "rosco" ? (G.rosco ? (G.rosco.done ? roscoEnd() : roscoPlay()) : roscoStart()) : (G.trivia ? (G.trivia.done ? triviaEnd() : triviaPlay()) : triviaStart());
  return h + vRanking();
}

/* rosco */
function roscoStart() {
  return '<section class="card"><h2>Rosco de Brasil</h2><p class="muted" style="margin:0 0 4px">26 letras y 150 segundos. Escribí la respuesta o tocá «Pasapalabra» para volver más tarde. No importan los acentos.</p>' + playerSel() +
    '<div class="row" style="margin-top:14px"><button class="btn primary" type="button" data-act="rstart">Empezar</button></div></section>';
}
function roscoPlay() {
  const R = G.rosco, q = ROSCO[R.cur], N = ROSCO.length;
  let svg = '<svg class="rosco" viewBox="0 0 340 340" role="img" aria-label="Rosco con ' + N + ' letras">';
  ROSCO.forEach((r, i) => {
    const a = -Math.PI / 2 + i * 2 * Math.PI / N, x = 170 + 146 * Math.cos(a), y = 170 + 146 * Math.sin(a);
    svg += '<circle class="rl ' + (R.st[i] === "p" ? "" : R.st[i]) + (i === R.cur ? " cur" : "") + '" cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="16"/><text class="rt" x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '">' + r.l + "</text>";
  });
  const ok = R.st.filter(s => s === "c").length;
  svg += '<text id="rtime" x="170" y="160" text-anchor="middle" style="font:900 56px var(--f-display);fill:var(--ink)">' + R.t + '</text><text x="170" y="192" text-anchor="middle" style="font:600 14px var(--f-body);fill:var(--muted)">' + ok + " correctas</text></svg>";
  return '<section class="card">' + svg + '<div class="eyebrow" style="margin-top:8px">' + esc(q.k) + '</div><div class="clue">' + esc(q.q) + '</div>' +
    '<form id="rf" autocomplete="off"><input type="text" id="ra" placeholder="Tu respuesta" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Tu respuesta">' +
    '<div class="row" style="margin-top:10px"><button class="btn primary grow" type="submit">Responder</button><button class="btn grow" type="button" data-act="rpass">Pasapalabra</button><button class="btn ghost" type="button" data-act="rend">Terminar</button></div></form></section>';
}
function roscoEnd() {
  const R = G.rosco, ok = R.st.filter(s => s === "c").length, miss = ROSCO.filter((r, i) => R.st[i] !== "c");
  return '<section class="card"><div class="eyebrow">' + esc(R.player) + '</div><div class="total num">' + ok + ' / ' + ROSCO.length + '</div><p class="muted" style="margin:6px 0 0">' + (R.t <= 0 ? "Se acabó el tiempo." : "Terminó la ronda.") + (isEx() ? " En el ejemplo no se guarda el ranking." : "") + "</p>" +
    (miss.length ? '<div class="eyebrow" style="margin:14px 0 6px">Las que faltaron</div><div class="small">' + miss.map(r => "<b>" + r.l + "</b> " + esc(r.d)).join(" · ") + "</div>" : '<p style="margin:12px 0 0"><b>¡Rosco perfecto!</b></p>') +
    '<div class="row" style="margin-top:14px"><button class="btn primary" type="button" data-act="rstart">Jugar de nuevo</button><button class="btn" type="button" data-act="rclose">Cerrar</button></div></section>';
}
function roscoBegin() {
  clearInterval(G.rosco && G.rosco.timer);
  const R = G.rosco = { player: G.player, st: ROSCO.map(() => "p"), cur: 0, t: 150, done: false, timer: null };
  R.timer = setInterval(() => {
    R.t--;
    const el = $("#rtime"); if (el) el.textContent = Math.max(R.t, 0);
    if (R.t <= 0) roscoFinish();
  }, 1000);
  render(); focusRosco();
}
function focusRosco() { const i = $("#ra"); if (i) i.focus(); }
function roscoFinish() {
  const R = G.rosco; if (!R || R.done) return;
  clearInterval(R.timer); R.done = true;
  saveScore("rosco", R.st.filter(s => s === "c").length, ROSCO.length);
  if (tab === "juego") render();
}
function roscoNext() {
  const R = G.rosco, n = ROSCO.length;
  for (let k = 1; k <= n; k++) { const i = (R.cur + k) % n; if (R.st[i] === "p" || R.st[i] === "s") { R.cur = i; render(); focusRosco(); return; } }
  roscoFinish();
}
function roscoAnswer(txt) {
  const R = G.rosco, q = ROSCO[R.cur];
  if (!norm(txt)) { R.st[R.cur] = "s"; return roscoNext(); }
  R.st[R.cur] = q.a.includes(norm(txt)) ? "c" : "w";
  roscoNext();
}

/* trivia */

}
function triviaEnd() {

/* ---------- sincronización (Firestore) ---------- */
const LSY = "viajecinho-sync";
const SYNC = { code: "", err: "", mode: "" };
const PENDING = [];
const LSC = "viajecinho-cache";
let cacheT;
function saveCache() { clearTimeout(cacheT); cacheT = setTimeout(() => { try { localStorage.setItem(LSC, JSON.stringify({ code: SYNC.code, S })); } catch (e) {} }, 400); }
const cleanCode = c => String(c || "").toLowerCase().replace(/[^a-z0-9-]/g, "").slice(0, 40);
const genCode = () => "rio-" + Array.from(crypto.getRandomValues(new Uint8Array(12)), b => "abcdefghjkmnpqrstuvwxyz23456789"[b % 31]).join("");
const syncLink = () => location.origin + location.pathname + "#g=" + SYNC.code;
let FSL = null;
async function loadFirebase() {
  if (FSL) return FSL;
  const base = "https://www.gstatic.com/firebasejs/10.12.2/";
  const [app, fs] = await Promise.all([import(base + "firebase-app.js"), import(base + "firebase-firestore.js")]);
  const a = app.initializeApp(FIREBASE_CONFIG);
  let dbi;
  const ios = /iPad|iPhone|iPod/.test(navigator.userAgent || "") || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  SYNC.mode = ios ? "estable (iPhone)" : "automático";
  const net = ios ? { experimentalForceLongPolling: true } : { experimentalAutoDetectLongPolling: true };
  try { dbi = fs.initializeFirestore(a, { ...net, localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() }) }); }
  catch (e) { dbi = fs.getFirestore(a); }
  FSL = { fs, dbi };
  return FSL;
}
function fsAdapter(fs, dbi, code) {
  const dref = p => fs.doc(dbi, "trips", code, ...p.split("/"));
  const cref = c => fs.collection(dbi, "trips", code, c);
  const sd = s => ({ exists: s.exists(), data: () => s.data(), metadata: s.metadata });
  return {
    doc: p => ({
      set: o => fs.setDoc(dref(p), o),
      get: () => fs.getDoc(dref(p)).then(sd),
      onSnapshot: (n, e) => fs.onSnapshot(dref(p), { includeMetadataChanges: true }, s => n(sd(s)), e)
    }),
    collection: c => ({
      doc: id => ({ set: o => fs.setDoc(fs.doc(cref(c), id), o), delete: () => fs.deleteDoc(fs.doc(cref(c), id)) }),
      onSnapshot: (n, e) => fs.onSnapshot(cref(c), { includeMetadataChanges: true }, s => n({ docs: s.docs.map(d => ({ data: () => d.data() })), metadata: s.metadata }), e)
    })
  };
}
/* Al volver a la app (o al recuperar internet) se reinicia la conexión, para que los cambios de los demás aparezcan enseguida */
function kick() {
  if (!FSL || !db) return false;
  FSL.fs.disableNetwork(FSL.dbi).then(() => FSL.fs.enableNetwork(FSL.dbi)).catch(() => {});
  return true;
}
let hiddenAt = 0;
document.addEventListener("visibilitychange", () => {
  if (document.hidden) hiddenAt = Date.now();
  else if (hiddenAt && Date.now() - hiddenAt > 4000) { hiddenAt = 0; kick(); }
});
window.addEventListener("online", () => { kick(); });
window.addEventListener("pageshow", e => { if (e.persisted) kick(); });
async function migrateLocal(h, local) {
  if (!local.meta || !local.meta.ready) return;
  try { const m = await h.doc("meta/main").get(); if (m.exists) return; } catch (e) { return; }
  const ps = [h.doc("meta/main").set(local.meta)];
  ["expenses", "items", "scores", "questions"].forEach(c => (local[c] || []).forEach(o => ps.push(h.collection(c).doc(o.id).set(o))));
  await Promise.race([Promise.allSettled(ps), new Promise(r => setTimeout(r, 8000))]);
}
async function connectSync(code, migrate, keep, quiet) {
  const wd = setTimeout(() => { if (!db) { SYNC.err = "firebase-no-carga"; syncState = "slow"; paintSync(); } }, 12000);
  try {
    const local = JSON.parse(JSON.stringify(S));
    const { fs, dbi } = await loadFirebase();
    clearTimeout(wd);
    const h = fsAdapter(fs, dbi, code);
    if (migrate) await migrateLocal(h, local);
    SYNC.code = code;
    try { localStorage.setItem(LSY, JSON.stringify({ code })); } catch (e) {}
    try { history.replaceState(null, "", location.pathname + location.search + "#g=" + code); } catch (e) {}
    attachDb(h, keep);
    return true;
  } catch (e) {
    clearTimeout(wd);
    SYNC.err = String((e && (e.code || e.message)) || "error").slice(0, 60); syncState = "slow"; paintSync();
    if (!quiet) toast("No se pudo conectar con Firebase. Revisá la configuración y la conexión.");
    return false;
  }
}
async function bootConnect(code, keep, n) {
  const ok = await connectSync(code, false, keep, n > 0);
  if (!ok && n < 6) setTimeout(() => bootConnect(code, keep, n + 1), 5000 * (n + 1));
}

  if (!FIREBASE_CONFIG) return h + '<p class="small muted" style="margin:0">Para que todos vean lo mismo hay que conectar Firebase (gratis). Falta pegar la configuración en el archivo; los pasos están en el README.</p>';

try { if (hashCode) localStorage.setItem(LSY, JSON.stringify({ code: hashCode })); } catch (e) {}
